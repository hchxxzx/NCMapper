name: Feature request
description: Suggest a new capability, an API addition, or a documentation improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. NCMapper is deliberately small and
        compile-time-oriented, so please explain the problem first — proposals
        framed around a concrete use case are much easier to evaluate than
        proposals framed around an API shape.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I have searched existing issues and discussions for this request.
          required: true
        - label: I have checked the documentation to confirm this is not already supported.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Fluent configuration channel
        - Attribute channel
        - Source generator behaviour
        - Runtime expression-tree engine
        - Deep copy
        - ORM integration (EF Core / FreeSql / Dapper)
        - Diagnostics and validation
        - Performance
        - Documentation
        - Tooling / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the task you are stuck on, not the API you want. Concrete scenarios help most.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: What do you do today instead? This tells us how much the gap actually costs.
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If you have an API shape in mind, sketch it here. It is fine to leave this empty.
      render: csharp
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other libraries, patterns, or designs you looked at.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints awareness
      description: |
        NCMapper optimizes for compile-time code generation and NativeAOT
        compatibility. Requests that require runtime reflection or dynamic code
        generation are unlikely to be accepted.
      options:
        - label: This proposal can work without runtime reflection or dynamic code generation.
          required: false
        - label: This proposal would keep the two engines (source generator and runtime expression trees) semantically equivalent.
          required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
    validations:
      required: false
