<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 710" width="880" height="710" role="img" aria-label="NCMapper 功能总览">
  <rect width="880" height="710" fill="#ffffff"/>
  <g font-family="Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif">

    <!-- 标题 -->
    <text x="32" y="46" font-size="27" font-weight="700" fill="#0f172a">NCMapper 功能总览</text>
    <text x="32" y="74" font-size="14.5" fill="#64748b">一次声明 · 自动选路 · 多场景复用</text>

    <!-- ① 声明规则 -->
    <rect x="32" y="96" width="392" height="184" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="52" y="132" font-size="18" font-weight="700" fill="#0f172a">① 声明规则</text>
    <text x="163" y="132" font-size="12.5" fill="#64748b">两种写法，能力等价，长期并存</text>

    <rect x="52" y="168" width="352" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="66" y="179" width="3" height="24" rx="1.5" fill="#2563eb"/>
    <text x="80" y="187" font-size="14.5" font-weight="600" fill="#1e293b">Fluent 链式通道</text>
    <text x="80" y="204" font-size="12.5" fill="#64748b">配置类 + 链式终端，规则集中一处</text>

    <rect x="52" y="222" width="352" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="66" y="233" width="3" height="24" rx="1.5" fill="#2563eb"/>
    <text x="80" y="241" font-size="14.5" font-weight="600" fill="#1e293b">特性标注通道</text>
    <text x="80" y="258" font-size="12.5" fill="#64748b">[MapFrom] / [MapProperty] 等 15 个特性</text>

    <!-- 连接箭头 -->
    <path d="M428 188 L444 188" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <path d="M443 183 L452 188 L443 193 Z" fill="#94a3b8"/>

    <!-- ② 自动选路 -->
    <rect x="456" y="96" width="392" height="184" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="476" y="132" font-size="18" font-weight="700" fill="#0f172a">② 自动选路</text>
    <text x="587" y="132" font-size="12.5" fill="#64748b">编译期优先，运行时兜底</text>

    <rect x="476" y="168" width="352" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="490" y="179" width="3" height="24" rx="1.5" fill="#0d9488"/>
    <text x="504" y="187" font-size="14.5" font-weight="600" fill="#1e293b">源生成器（编译期）</text>
    <text x="504" y="204" font-size="12.5" fill="#64748b">Roslyn 增量生成 · 零反射热路径 · AOT 友好</text>

    <rect x="476" y="222" width="352" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="490" y="233" width="3" height="24" rx="1.5" fill="#7c3aed"/>
    <text x="504" y="241" font-size="14.5" font-weight="600" fill="#1e293b">表达式树（运行时）</text>
    <text x="504" y="258" font-size="12.5" fill="#64748b">首次编译并缓存 · JIT 泛型静态缓存</text>

    <!-- ③ 多场景复用 -->
    <text x="32" y="316" font-size="18" font-weight="700" fill="#0f172a">③ 多场景复用</text>
    <text x="159" y="316" font-size="12.5" fill="#64748b">同一份规则，以下场景直接复用</text>

    <!-- 卡片 1 内存映射 -->
    <rect x="32" y="334" width="261" height="100" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="50" cy="358" r="5" fill="#2563eb"/>
    <text x="64" y="363" font-size="15.5" font-weight="600" fill="#0f172a">内存映射</text>
    <text x="50" y="388" font-size="12.5" fill="#64748b">Entity ↔ DTO 双向映射</text>
    <text x="50" y="406" font-size="12.5" fill="#64748b">同名自动匹配</text>
    <text x="50" y="424" font-size="12.5" fill="#64748b">忽略大小写 + 扁平化</text>

    <!-- 卡片 2 ORM 投影 -->
    <rect x="309" y="334" width="261" height="100" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="327" cy="358" r="5" fill="#0d9488"/>
    <text x="341" y="363" font-size="15.5" font-weight="600" fill="#0f172a">ORM 投影</text>
    <text x="327" y="388" font-size="12.5" fill="#64748b">FreeSql / EFCore / Dapper</text>
    <text x="327" y="406" font-size="12.5" fill="#64748b">AsDto() 一条 SQL 直出 DTO</text>
    <text x="327" y="424" font-size="12.5" fill="#64748b">不可翻译时自动降级</text>

    <!-- 卡片 3 深拷贝 -->
    <rect x="586" y="334" width="261" height="100" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="604" cy="358" r="5" fill="#7c3aed"/>
    <text x="618" y="363" font-size="15.5" font-weight="600" fill="#0f172a">深拷贝</text>
    <text x="604" y="388" font-size="12.5" fill="#64748b">三层策略：源生成器 → Fast</text>
    <text x="604" y="406" font-size="12.5" fill="#64748b">→ 表达式树（默认 Fast）</text>
    <text x="604" y="424" font-size="12.5" fill="#64748b">循环引用检测 · 16 种集合</text>

    <!-- 卡片 4 多源合成 -->
    <rect x="32" y="442" width="261" height="100" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="50" cy="466" r="5" fill="#d97706"/>
    <text x="64" y="471" font-size="15.5" font-weight="600" fill="#0f172a">多源合成</text>
    <text x="50" y="496" font-size="12.5" fill="#64748b">Compose() 多源合成聚合 DTO</text>
    <text x="50" y="514" font-size="12.5" fill="#64748b">ComposeList() 批量合成</text>
    <text x="50" y="532" font-size="12.5" fill="#64748b">多张表 / 多个对象合一个</text>

    <!-- 卡片 5 数据脱敏 -->
    <rect x="309" y="442" width="261" height="100" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="327" cy="466" r="5" fill="#e11d48"/>
    <text x="341" y="471" font-size="15.5" font-weight="600" fill="#0f172a">数据脱敏</text>
    <text x="327" y="496" font-size="12.5" fill="#64748b">9 种内置 + 自定义 IMask</text>
    <text x="327" y="514" font-size="12.5" fill="#64748b">手机 / 身份证 / 邮箱</text>
    <text x="327" y="532" font-size="12.5" fill="#64748b">与自定义转换正交组合</text>

    <!-- 卡片 6 治理与诊断 -->
    <rect x="586" y="442" width="261" height="100" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="604" cy="466" r="5" fill="#475569"/>
    <text x="618" y="471" font-size="15.5" font-weight="600" fill="#0f172a">治理与诊断</text>
    <text x="604" y="496" font-size="12.5" fill="#64748b">编译期诊断码守护</text>
    <text x="604" y="514" font-size="12.5" fill="#64748b">NCMAP0xx / NCMAP_Fxx</text>
    <text x="604" y="532" font-size="12.5" fill="#64748b">映射验证 · Trace · Metrics</text>

    <!-- ④ 工程集成 -->
    <text x="32" y="574" font-size="18" font-weight="700" fill="#0f172a">④ 工程集成</text>
    <text x="159" y="574" font-size="12.5" fill="#64748b">与上面的场景配合使用</text>

    <rect x="32" y="594" width="816" height="76" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

    <rect x="54" y="616" width="73" height="32" rx="16" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/>
    <text x="90" y="637" font-size="12.5" fill="#334155" text-anchor="middle">DI 注入</text>

    <rect x="139" y="616" width="105" height="32" rx="16" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/>
    <text x="191" y="637" font-size="12.5" fill="#334155" text-anchor="middle">AOT 裁剪友好</text>

    <rect x="256" y="616" width="132" height="32" rx="16" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/>
    <text x="322" y="637" font-size="12.5" fill="#334155" text-anchor="middle">映射管道 PostMap</text>

    <rect x="400" y="616" width="105" height="32" rx="16" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/>
    <text x="452" y="637" font-size="12.5" fill="#334155" text-anchor="middle">映射验证报告</text>

    <rect x="517" y="616" width="93" height="32" rx="16" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/>
    <text x="563" y="637" font-size="12.5" fill="#334155" text-anchor="middle">诊断 Trace</text>

    <rect x="622" y="616" width="80" height="32" rx="16" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/>
    <text x="662" y="637" font-size="12.5" fill="#334155" text-anchor="middle">分页封装</text>

    <rect x="714" y="616" width="105" height="32" rx="16" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.2"/>
    <text x="766" y="637" font-size="12.5" fill="#334155" text-anchor="middle">多语言错误消息</text>

  </g>
</svg>
